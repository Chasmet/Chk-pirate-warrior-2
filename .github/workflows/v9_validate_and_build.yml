name: V9 - Valider combat évolutif puis compiler APK

on:
  push:
    branches:
      - agent/v9-combat-progression
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/v9_validate_and_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-v9-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer V9
        uses: actions/checkout@v4

      - name: Vérifier le catalogue des attaques
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/heroes.json >/dev/null
          python3 - <<'PY'
          import json
          with open('data/heroes.json', encoding='utf-8') as f:
              heroes = json.load(f)
          expected = {
              'cheikh': ['Épée des Trois Cerbères', 'Épée Isolant', 'Triple Morsure de Cerbère', 'Tempête des Trois Lames', 'Jugement du Roi Pirate'],
              'yvane': ['Foudre Serpentine', 'Éco Sphère', "La Méga Boule d'Énergie"],
              'nelvyn': ['La Boule de Bing Bang', 'Boule de Feu Suprême', 'La Lame de Crystal'],
          }
          for hero_id, names in expected.items():
              hero = heroes[hero_id]
              actual = [hero['base_attack']] + [a['name'] for a in hero['abilities']]
              assert actual == names, (hero_id, actual)
              unlocks = [1] + [int(a['unlock_level']) for a in hero['abilities']]
              assert unlocks == sorted(set(unlocks)), (hero_id, unlocks)
              assert all(float(a['damage']) > 0 for a in hero['abilities'])
              assert all(float(a['radius']) >= 1 for a in hero['abilities'])
          print('Catalogue V9 valide')
          PY

      - name: Installer Godot 4.4 stable pour le contrôle de compatibilité
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Construire le mini-projet gameplay V9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci_validate
          mkdir -p ci_validate
          cp project.godot ci_validate/
          cp -R scenes scripts data ci_validate/
          if [ -f default_bus_layout.tres ]; then cp default_bus_layout.tres ci_validate/; fi
          # Quelques systèmes gameplay préchargent de petits scripts placés dans
          # assets/ (ex. visuels véhicules). On copie uniquement ces .gd, jamais
          # les centaines de Mo de GLB/audio.
          while IFS= read -r -d '' file; do
            mkdir -p "ci_validate/$(dirname "$file")"
            cp "$file" "ci_validate/$file"
          done < <(find assets -type f -name '*.gd' -print0)
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci_validate/project.godot')
          text = p.read_text(encoding='utf-8')
          marker = '\n[editor_plugins]\n'
          start = text.find(marker)
          if start >= 0:
              end = text.find('\n[', start + len(marker))
              if end < 0:
                  text = text[:start].rstrip() + '\n'
              else:
                  text = text[:start] + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Parser scripts et scènes V9
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path ci_validate --editor --quit-after 7 2>&1 | tee v9-godot-validate.log || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|Parser Error" v9-godot-validate.log; then
            echo 'Erreur Godot détectée dans le gameplay V9.'
            exit 3
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Exécuter audit combat V9
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path ci_validate --script res://scripts/tests/v9_combat_progression_audit.gd 2>&1 | tee v9-combat-audit.log
          grep -q 'CHK_PIRATE_WARRIOR_2_V9_COMBAT_PROGRESSION_OK' v9-combat-audit.log

      - name: Vérifier intégration mobile et coop
        shell: bash
        run: |
          grep -q 'NetworkManager="\*res://scripts/network/network_manager_v9.gd"' project.godot
          grep -q 'mobile_input_overlay_v9.gd' scenes/ui/mobile_input_overlay.tscn
          grep -q 'attack_fx_v9.gd' scenes/main/main.tscn
          grep -q 'cycle_special_attack' scripts/player/hero_controller_v3.gd
          grep -q 'unlock_level' data/heroes.json
          grep -q 'level_multiplier' scripts/network/network_manager_v9.gd

      - name: Publier journaux V9
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V9-Combat-Progression-Validation
          path: |
            v9-godot-validate.log
            v9-combat-audit.log
          if-no-files-found: warn
          retention-days: 14

  dispatch-full-apk:
    needs: validate-v9-combat
    runs-on: ubuntu-latest
    steps:
      - name: Lancer le workflow APK complet sur V9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_android_apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
          echo "Compilation APK complète demandée pour $GITHUB_REF_NAME"
