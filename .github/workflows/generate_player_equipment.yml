name: Générer les équipements des héros

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate_player_equipment.py'
      - '.github/workflows/generate_player_equipment.yml'

permissions:
  contents: write

jobs:
  generate-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Blender et le rendu logiciel
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libegl-mesa0 libgl1-mesa-dri
          blender --version

      - name: Générer sacs à dos et armes
        run: |
          blender --background --python tools/generate_player_equipment.py -- "$GITHUB_WORKSPACE"

      - name: Vérifier les GLB et PNG
        run: |
          python3 - <<'PY'
          import pathlib
          expected = [
              pathlib.Path('assets/equipements/sacs_a_dos/glb/sac_yvane_bleu.glb'),
              pathlib.Path('assets/equipements/sacs_a_dos/glb/sac_nelvyn_noir.glb'),
              pathlib.Path('assets/equipements/sacs_a_dos/glb/sac_cheikh_orange.glb'),
              pathlib.Path('assets/equipements/armes/glb/batte_cheikh.glb'),
              pathlib.Path('assets/equipements/armes/glb/epee_nelvyn.glb'),
          ]
          for path in expected:
              assert path.exists(), path
              assert path.read_bytes()[:4] == b'glTF', path
              assert 1000 < path.stat().st_size < 500000, (path, path.stat().st_size)
              print(path, path.stat().st_size)
          pngs = list(pathlib.Path('assets/equipements').glob('**/*.png'))
          assert len(pngs) >= 5
          PY

      - name: Commit et push robuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/equipements
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Ajouter les sacs et armes 3D des héros [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
