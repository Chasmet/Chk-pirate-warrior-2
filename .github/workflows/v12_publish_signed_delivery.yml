name: V12.0.8 - Publier APK signe et verifie

on:
  workflow_dispatch:
  push:
    branches: [work/v12-signed-delivery]
    paths:
      - '.github/workflows/v12_publish_signed_delivery.yml'
      - 'android-signing/releases/v12.0.8.json'
      - 'tools/v12_signed_delivery.py'
      - 'tools/test_v12_signed_delivery.py'
      - 'tools/publish_v12_metadata.py'
      - 'docs/RELEASE_V12.md'

permissions:
  contents: write
  actions: read

concurrency:
  group: chk-v12-signing
  cancel-in-progress: false

env:
  RELEASE_TAG: v12.0.8
  SOURCE_RUN_ID: '36721195662'
  SOURCE_SHA: '3d23fc12d1d9aef2f3f2ec41c10de7ecd5d7b3cd'
  APK_NAME: CHK_Pirate_Warrior_2.apk
  ACTION_ARTIFACT_NAME: CHK-Pirate-Warrior-2-V12.0.8-APK

jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier les gardes de livraison et de signature
        run: |
          python tools/test_v12_signed_delivery.py
          python tools/test_v12_signing.py

      - name: Vérifier la provenance de la compilation V12.0.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/Chasmet/Chk-pirate-warrior-2/actions/runs/$SOURCE_RUN_ID" > /tmp/chk-source-run.json
          gh api "repos/Chasmet/Chk-pirate-warrior-2/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > /tmp/chk-source-jobs.json
          python - <<'PY'
          import json, os
          run = json.load(open('/tmp/chk-source-run.json'))
          jobs = json.load(open('/tmp/chk-source-jobs.json'))['jobs']
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['head_repository']['full_name'] == 'Chasmet/Chk-pirate-warrior-2'
          required = {
              'Audit complet et régressions du jeu',
              'Captures du rendu réel',
              'Compiler le véritable APK complet via Gradle',
          }
          conclusions = {}
          for job in jobs:
              for step in job.get('steps', []):
                  if step.get('name') in required:
                      conclusions[step['name']] = step.get('conclusion')
          assert conclusions == {name: 'success' for name in required}, conclusions
          PY

      - uses: actions/download-artifact@v4
        with:
          name: CHK-V12.0.8-APK-PART-00
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: parts/00

      - uses: actions/download-artifact@v4
        with:
          name: CHK-V12.0.8-APK-PART-01
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: parts/01

      - uses: actions/download-artifact@v4
        with:
          name: CHK-V12.0.8-APK-PART-02
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: parts/02

      - uses: actions/download-artifact@v4
        with:
          name: CHK-V12.0.8-APK-PART-03
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: parts/03

      - name: Reconstituer l'APK V12.0.8 validé
        run: |
          mkdir -p artifact
          cat parts/00/apk.part.00 parts/01/apk.part.01 parts/02/apk.part.02 parts/03/apk.part.03 > artifact/CHK_Pirate_Warrior_2_unsigned.apk
          echo 'f65c2dba5b189bd94a5f34f558e7fbebe99c39587e71520be0a164d8535dabac  artifact/CHK_Pirate_Warrior_2_unsigned.apk' | sha256sum --check
          grep -q 'f65c2dba5b189bd94a5f34f558e7fbebe99c39587e71520be0a164d8535dabac' parts/03/SHA256.txt

      - name: Restituer exactement la signature Android permanente
        run: |
          python tools/v12_signed_delivery.py apply android-signing/releases/v12.0.8.json artifact/CHK_Pirate_Warrior_2_unsigned.apk artifact/CHK_Pirate_Warrior_2.apk
          echo '2d0b0216486fdb95dd42f4c2172acfab91ad7bad1c69b274ff7450d19068ebb8  artifact/CHK_Pirate_Warrior_2.apk' | sha256sum --check

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.1.0'

      - name: Vérifier signature Android et alignement 16 Ko
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "artifact/$APK_NAME" | tee artifact/apksigner.txt
          grep -q '75982f8c52d2059e5140cb5e361a6a80e46181f4b81b66e9c21bf2e0197779e4' artifact/apksigner.txt
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4 "artifact/$APK_NAME"

      - name: Mettre l'APK directement dans cette exécution Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ACTION_ARTIFACT_NAME }}
          path: artifact/CHK_Pirate_Warrior_2.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Vérifier si la release V12.0.8 existe déjà
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo Chasmet/Chk-pirate-warrior-2 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Contrôler certificat, version et circuit de mise à jour
        if: steps.existing_release.outputs.exists != 'true'
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_v12_metadata.py

      - name: Publier la V12.0.8 dans GitHub Releases
        if: steps.existing_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_FROM_CHECK: ${{ steps.release.outputs.tag }}
        run: |
          test "$RELEASE_TAG_FROM_CHECK" = "$RELEASE_TAG"
          gh release create "$RELEASE_TAG_FROM_CHECK" artifact/CHK_Pirate_Warrior_2.apk artifact/update.json artifact/SHA256.txt artifact/SIGNATURE.txt --repo Chasmet/Chk-pirate-warrior-2 --target "$SOURCE_SHA" --title "CHK Pirate Warrior 2 $RELEASE_TAG_FROM_CHECK" --notes-file artifact/RELEASE_NOTES.md

      - name: Vérifier la release existante
        if: steps.existing_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL_SHA="sha256:$(sha256sum "artifact/$APK_NAME" | awk '{print $1}')"
          REMOTE_SHA="$(gh api "repos/Chasmet/Chk-pirate-warrior-2/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "CHK_Pirate_Warrior_2.apk") | .digest')"
          test -n "$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"

      - name: Résultat
        run: |
          {
            echo '## CHK Pirate Warrior 2 V12.0.8'
            echo
            echo '✅ APK signé avec le certificat permanent de la V12.0.5.'
            echo
            echo '✅ V12.0.8 prête pour une mise à jour Android par-dessus la V12.0.7.'
            echo
            echo '✅ Mise à jour gameplay : cheval plus maniable, direction lissée et caméra monture/véhicule à suivi automatique.'
            echo "Artifact : `$ACTION_ARTIFACT_NAME`"
          } >> "$GITHUB_STEP_SUMMARY"
