name: V11.2 - Validation Godot

on:
  push:
    branches:
      - agent/v11-2-navigation-interactions-coop-save
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-v11-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier fichiers V11.2
        run: |
          test -f scripts/ui/gameplay_ux_overlay_v11_2.gd
          test -f scripts/world/story_quest_director_v11_2.gd
          test -f scripts/world/story_quest_item_fix_v11_2.gd
          test -f scripts/systems/game_state_v11_2.gd
          test -f scripts/network/network_manager_v11_2.gd
