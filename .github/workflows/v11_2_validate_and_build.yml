name: V11.2 - Validation Godot

on:
  push:
    branches:
      - agent/v11-2-navigation-interactions-coop-save
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-v11-2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier fichiers V11.2
        run: |
          test -f scripts/ui/gameplay_ux_overlay_v11_2.gd
          test -f scripts/world/story_quest_director_v11_2.gd
          test -f scripts/world/story_quest_item_fix_v11_2.gd
          test -f scripts/systems/game_state_v11_2.gd
          test -f scripts/network/network_manager_v11_2.gd
          grep -q 'game_state_v11_2.gd' project.godot
          grep -q 'network_manager_v11_2.gd' project.godot
          grep -q 'story_quest_item_fix_v11_2.gd' scenes/main/main.tscn
          grep -q 'gameplay_ux_overlay_v11_2.gd' scenes/main/main.tscn
          grep -q 'V112_INTERACTION_DISTANCE := 6.0' scripts/world/story_quest_director_v11_2.gd
          grep -q 'savegame_coop_v11_2.json' scripts/systems/game_state_v11_2.gd
          grep -q '_become_replacement_host' scripts/network/network_manager_v11_2.gd
          grep -q '_on_replacement_session_discovered' scripts/network/network_manager_v11_2.gd

      - name: Installer Godot 4.4
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Construire mini-projet
        run: |
          rm -rf ci_validate
          mkdir -p ci_validate
          cp project.godot ci_validate/
          cp -R scenes scripts data ci_validate/
          if [ -f default_bus_layout.tres ]; then cp default_bus_layout.tres ci_validate/; fi
          while IFS= read -r -d '' file; do
            mkdir -p "ci_validate/$(dirname "$file")"
            cp "$file" "ci_validate/$file"
          done < <(find assets -type f -name '*.gd' -print0)
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci_validate/project.godot')
          text = p.read_text(encoding='utf-8')
          marker = '\n[editor_plugins]\n'
          start = text.find(marker)
          if start >= 0:
              end = text.find('\n[', start + len(marker))
              text = text[:start].rstrip() + '\n' if end < 0 else text[:start] + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Parser scripts et scènes
        run: |
          set -o pipefail
          timeout 50s godot --headless --path ci_validate --editor --quit-after 8 2>&1 | tee v11-2-godot.log || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E 'SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|Parser Error' v11-2-godot.log; then
            exit 3
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then exit "$STATUS"; fi

  dispatch-full-apk:
    needs: validate-v11-2
    runs-on: ubuntu-latest
    steps:
      - name: Lancer compilation Android complète
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_android_apk.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
