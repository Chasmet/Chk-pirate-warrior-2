name: Déclencher APK V11.7 Endgame

on:
  push:
    branches:
      - agent/v11-7-endgame-trophy

permissions:
  contents: read
  actions: write

jobs:
  dispatch-full-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lancer le workflow APK complet V11.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_android_apk.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
