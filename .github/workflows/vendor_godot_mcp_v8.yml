name: V8 - Vendor Godot MCP 0.8.x

on:
  push:
    branches:
      - agent/v8-godot47-mcp-phone
    paths:
      - '.github/workflows/vendor_godot_mcp_v8.yml'
      - 'project.godot'
      - 'addons/chk_mcp_relay/**'
      - 'mcp-relay-server/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-addon:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip mcp vendor]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8
        uses: actions/checkout@v4
        with:
          ref: agent/v8-godot47-mcp-phone
          fetch-depth: 0

      - name: Download official Godot MCP asset-library branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/godot-mcp /tmp/godot-mcp.zip addons/godot_mcp
          mkdir -p /tmp/godot-mcp
          curl --fail --location --retry 3 \
            https://github.com/regiellis/godot-mcp-go/archive/refs/heads/asset-library.zip \
            --output /tmp/godot-mcp.zip
          unzip -q /tmp/godot-mcp.zip -d /tmp/godot-mcp
          SRC="$(find /tmp/godot-mcp -type d -path '*/addons/godot_mcp' -print -quit)"
          test -n "$SRC"
          mkdir -p addons
          cp -a "$SRC" addons/godot_mcp
          test -f addons/godot_mcp/plugin.cfg
          test -f addons/godot_mcp/plugin.gd
          echo "Official addon copied from: $SRC"

      - name: Record upstream source
        shell: bash
        run: |
          cat > addons/godot_mcp/CHK_UPSTREAM.txt <<'EOF'
          Upstream: https://github.com/regiellis/godot-mcp-go
          Source branch: asset-library
          Purpose: Godot MCP/CLI editor addon for CHK Pirate Warrior 2 V8.
          License: MIT (see addon LICENSE).
          The upstream Asset Library entry requires Godot 4.7 or newer.
          EOF

      - name: Commit vendored addon when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CHK MCP Vendor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add addons/godot_mcp
          if git diff --cached --quiet; then
            echo "Godot MCP addon already up to date."
            exit 0
          fi
          git commit -m "V8: vendor Godot MCP official addon [skip mcp vendor]"
          git push origin HEAD:agent/v8-godot47-mcp-phone
