name: Compiler et auditer APK Android complet

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v11-8-full-audit-fixes
      - agent/v11-6-advanced-enemy-ai
      - agent/full-game-rebuild-v1
      - agent/v8-godot47-mcp-phone
  pull_request:
    branches:
      - agent/v11-6-advanced-enemy-ai

permissions:
  contents: read

jobs:
  audit-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Récupérer le dépôt complet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34' \
            'cmake;3.10.2.4988404' \
            'ndk;23.2.8568313'

      - name: Installer Godot 4.7.1 et modèles Android
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION='4.7.1'
          GODOT_TAG="${GODOT_VERSION}-stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p /tmp/godot "$TEMPLATE_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x "/tmp/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo ln -sf "/tmp/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/godot/templates.tpz
          unzip -q -j /tmp/godot/templates.tpz -d "$TEMPLATE_DIR"
          godot --version
          godot --version | grep -q '^4\.7\.1'

      - name: Créer la clé Android debug
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Configurer Godot Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF

      - name: Récupérer les modèles CC0 du 4x4 et du cheval
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_cc0_ride_assets.sh
          tools/fetch_cc0_ride_assets.sh "$GITHUB_WORKSPACE"
          test -s assets/cc0_rides/4x4_kenney.glb
          test -s assets/cc0_rides/horse_quaternius.glb
          ls -lh assets/cc0_rides/*.glb

      - name: Construire le projet de validation complet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci_export artifact
          mkdir -p ci_export artifact

          cp project.godot export_presets.cfg default_bus_layout.tres ci_export/
          cp -R scenes scripts data assets addons ci_export/
          cp 'joueur 1 cheikh anime.glb' ci_export/
          cp 'Yvane_anime_Godot_Draco.glb' ci_export/
          cp 'player_3_Nelvyn_Godot_anime (1).glb' ci_export/

          echo '===== INVENTAIRE PROJET COMPLET ====='
          test -s ci_export/default_bus_layout.tres
          test -d ci_export/addons
          test "$(find ci_export/assets/royaumes -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 11
          echo "GLB: $(find ci_export -type f -iname '*.glb' | wc -l)"
          echo "AUDIO: $(find ci_export/assets/audio -type f \( -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.wav' \) | wc -l)"
          ASSET_MB=$(du -sm ci_export/assets | cut -f1)
          echo "Assets: ${ASSET_MB} Mo"
          if [ "$ASSET_MB" -lt 100 ]; then
            echo "ERREUR: seulement ${ASSET_MB} Mo d'assets copiés; export incomplet."
            exit 2
          fi

      - name: Réparer les GLB compressés et isoler les fichiers corrompus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gltf-convert
          : > "$GITHUB_WORKSPACE/artifact/GLB_BROKEN.txt"
          cd /tmp/gltf-convert
          npm init -y >/dev/null 2>&1
          npm install --silent @gltf-transform/core@4 @gltf-transform/extensions@4 @gltf-transform/functions@4 draco3dgltf
          cat > repair_all_glb.mjs <<'NODE'
          import { NodeIO } from '@gltf-transform/core';
          import { ALL_EXTENSIONS } from '@gltf-transform/extensions';
          import { dequantize } from '@gltf-transform/functions';
          import draco3d from 'draco3dgltf';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.argv[2];
          const reportPath = process.argv[3];
          const decoder = await draco3d.createDecoderModule();
          const encoder = await draco3d.createEncoderModule();
          const io = new NodeIO()
            .registerExtensions(ALL_EXTENSIONS)
            .registerDependencies({
              'draco3d.decoder': decoder,
              'draco3d.encoder': encoder,
            });

          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.name.toLowerCase().endsWith('.glb')) files.push(p);
            }
          }
          walk(root);

          let rewritten = 0;
          let dracoDecoded = 0;
          let dequantized = 0;
          let quarantined = 0;
          const broken = [];

          for (const file of files) {
            try {
              const doc = await io.read(file);
              const extensions = doc.getRoot().listExtensionsUsed();
              const dracoExt = extensions.find(e => e.extensionName === 'KHR_draco_mesh_compression');
              const quantExt = extensions.find(e => e.extensionName === 'KHR_mesh_quantization');
              let changed = false;

              if (quantExt) {
                await doc.transform(dequantize());
                dequantized++;
                changed = true;
              }

              if (dracoExt) {
                dracoExt.dispose();
                dracoDecoded++;
                changed = true;
              }

              if (changed) {
                const tmp = file + '.repaired.glb';
                await io.write(tmp, doc);
                fs.renameSync(tmp, file);
                rewritten++;
                console.log('GLB réparé:', path.relative(root, file));
              }
            } catch (error) {
              quarantined++;
              const relative = path.relative(root, file);
              const message = `${relative} | ${String(error)}`;
              broken.push(message);
              fs.renameSync(file, file + '.invalid');
              console.warn('GLB isolé:', message);
            }
          }

          fs.writeFileSync(reportPath,
            `GLB analysés=${files.length}\nRéécrits=${rewritten}\nDraco décodés=${dracoDecoded}\nDéquantifiés=${dequantized}\nIsolés=${quarantined}\n\n` +
            broken.join('\n') + '\n');
          console.log(`GLB analysés=${files.length}, réécrits=${rewritten}, Draco=${dracoDecoded}, déquantifiés=${dequantized}, isolés=${quarantined}`);
          NODE
          node repair_all_glb.mjs "$GITHUB_WORKSPACE/ci_export" "$GITHUB_WORKSPACE/artifact/GLB_BROKEN.txt"
          cat "$GITHUB_WORKSPACE/artifact/GLB_BROKEN.txt"

      - name: Importer toutes les ressources Godot
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" --import 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-import.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Cannot open file" "$GITHUB_WORKSPACE/artifact/godot-import.log"; then
            echo 'Erreur de script ou ressource détectée pendant import.'
            exit 3
          fi

      - name: Audit statique complet V11.8
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --script res://scripts/tests/full_repo_audit.gd 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-full-audit.log"

      - name: Vérifier joystick HUD graphismes et coop
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --script res://scripts/tests/v9_mobile_coop_regression_audit.gd 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-coop-audit.log"

      - name: Vérifier le chargement du projet
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path "$GITHUB_WORKSPACE/ci_export" --editor --quit-after 6 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-smoke.log" || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|Cannot open file" "$GITHUB_WORKSPACE/artifact/godot-smoke.log"; then
            exit 4
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Audit runtime global V11.8
        shell: bash
        run: |
          set -o pipefail
          timeout 210s godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --script res://scripts/tests/v11_8_runtime_audit.gd 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-v11-8-runtime-audit.log" || STATUS=$?
          STATUS=${STATUS:-0}
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q 'CHK_PIRATE_WARRIOR_2_V11_8_RUNTIME_AUDIT_OK' "$GITHUB_WORKSPACE/artifact/godot-v11-8-runtime-audit.log"

      - name: Tester en jeu recul HUD et herbe visible
        shell: bash
        run: |
          set -o pipefail
          timeout 210s godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            res://scenes/tests/v10_mobile_feedback_runtime_test.tscn 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-runtime-mobile.log" || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|ÉCHEC FEEDBACK MOBILE" "$GITHUB_WORKSPACE/artifact/godot-runtime-mobile.log"; then
            exit 5
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q 'CHK_PIRATE_WARRIOR_2_V10_MOBILE_FEEDBACK_OK' "$GITHUB_WORKSPACE/artifact/godot-runtime-mobile.log"

      - name: Exporter le véritable APK Android complet
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_export/build/android"
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --export-debug Android \
            "$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_V11_8_AUDIT_unsigned.apk" \
            --verbose 2>&1 | tee "$GITHUB_WORKSPACE/artifact/godot-export.log"
          test -s "$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_V11_8_AUDIT_unsigned.apk"

      - name: Aligner signer et vérifier l'APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_V11_8_AUDIT_unsigned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V11_8_AUDIT.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$GITHUB_WORKSPACE/artifact/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$FINAL_APK" "$GITHUB_WORKSPACE/artifact/aligned.apk"
          rm "$GITHUB_WORKSPACE/artifact/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"
          unzip -t "$FINAL_APK" >/dev/null
          APK_MB=$(du -m "$FINAL_APK" | cut -f1)
          echo "APK final: ${APK_MB} Mo"
          if [ "$APK_MB" -lt 70 ]; then
            echo 'ERREUR: APK anormalement petit; les assets complets ne sont probablement pas embarqués.'
            exit 6
          fi
          sha256sum "$FINAL_APK" | tee "$GITHUB_WORKSPACE/artifact/SHA256.txt"

      - name: Publier APK complet et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-2-V11-8-AUDIT
          path: |
            artifact/CHK_Pirate_Warrior_2_V11_8_AUDIT.apk
            artifact/SHA256.txt
            artifact/GLB_BROKEN.txt
            artifact/godot-import.log
            artifact/godot-full-audit.log
            artifact/godot-coop-audit.log
            artifact/godot-smoke.log
            artifact/godot-v11-8-runtime-audit.log
            artifact/godot-runtime-mobile.log
            artifact/godot-export.log
          if-no-files-found: warn
          retention-days: 30
