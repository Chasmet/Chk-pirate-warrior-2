name: Compiler APK Android jouable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer l'environnement Android requis par Godot 4.4
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34' \
            'cmake;3.10.2.4988404' \
            'ndk;23.2.8568313'
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Installer Godot 4.4 et ses modèles Android
        shell: bash
        run: |
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/4.4.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_v4.4-stable_linux.x86_64
          sudo ln -sf /tmp/godot/bin/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz -O /tmp/godot/templates.tpz
          unzip -q -j /tmp/godot/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.4.stable"
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"

      - name: Créer la clé Android debug
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          test -f "$HOME/.android/debug.keystore"

      - name: Configurer les chemins Android et le keystore lus par Godot 4.4
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF
          test -f "$HOME/.android/debug.keystore"

      - name: Construire un projet d'export propre
        shell: bash
        run: |
          rm -rf ci_export artifact
          mkdir -p ci_export/assets artifact
          cp project.godot ci_export/
          cp export_presets.cfg ci_export/
          cp -R scenes ci_export/
          cp -R scripts ci_export/
          cp -R data ci_export/
          cp -R assets/equipements ci_export/assets/
          cp -R assets/audio ci_export/assets/
          cp 'joueur 1 cheikh anime.glb' ci_export/
          cp 'player_3_Nelvyn_Godot_anime (1).glb' ci_export/

          mkdir -p /tmp/gltf-convert
          cd /tmp/gltf-convert
          npm init -y >/dev/null 2>&1
          npm install --silent @gltf-transform/core@4 @gltf-transform/extensions@4 draco3dgltf
          cat > decode_draco.mjs <<'NODE'
          import { NodeIO } from '@gltf-transform/core';
          import { ALL_EXTENSIONS } from '@gltf-transform/extensions';
          import draco3d from 'draco3dgltf';
          import process from 'node:process';

          const input = process.argv[2];
          const output = process.argv[3];
          const decoder = await draco3d.createDecoderModule();
          const io = new NodeIO()
            .registerExtensions(ALL_EXTENSIONS)
            .registerDependencies({'draco3d.decoder': decoder});
          const document = await io.read(input);
          for (const extension of document.getRoot().listExtensionsUsed()) {
            if (extension.extensionName === 'KHR_draco_mesh_compression') extension.dispose();
          }
          await io.write(output, document);
          NODE
          node decode_draco.mjs \
            "$GITHUB_WORKSPACE/Yvane_anime_Godot_Draco.glb" \
            "$GITHUB_WORKSPACE/ci_export/Yvane_anime_Godot_Draco.glb" \
            || echo 'Conversion Yvane impossible : visuel de secours disponible.'
          cd "$GITHUB_WORKSPACE"

      - name: Importer le projet avec Godot
        shell: bash
        run: |
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" --import

      - name: Exporter le véritable APK Android
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci_export/build/android"
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --export-debug Android \
            "$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_V0.2_unsigned.apk" \
            --verbose
          test -s "$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_V0.2_unsigned.apk"

      - name: Aligner, signer et vérifier l'APK
        shell: bash
        run: |
          SOURCE_APK="$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_V0.2_unsigned.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2_aligned.apk"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk" \
            "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2_aligned.apk"
          rm "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2_aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk"
          unzip -t "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk" >/dev/null
          test -s "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk"
          ls -lh "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk"
          file "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk"
          sha256sum "$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_V0.2.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-2-V0.2-APK
          path: artifact/CHK_Pirate_Warrior_2_V0.2.apk
          if-no-files-found: error
          retention-days: 30
