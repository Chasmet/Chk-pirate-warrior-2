name: Compiler APK Android jouable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - 'assets/equipements/**'
      - 'assets/audio/**'
      - 'joueur 1 cheikh anime.glb'
      - 'player_3_Nelvyn_Godot_anime (1).glb'
      - 'Yvane_anime_Godot_Draco.glb'
      - '.github/workflows/build_android_apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34'

      - name: Créer la clé de signature debug Android
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Construire un projet d'export propre
        shell: bash
        run: |
          rm -rf ci_export
          mkdir -p ci_export/assets
          cp project.godot ci_export/
          cp export_presets.cfg ci_export/
          cp -R scenes ci_export/
          cp -R scripts ci_export/
          cp -R data ci_export/
          cp -R assets/equipements ci_export/assets/
          cp -R assets/audio ci_export/assets/
          cp 'joueur 1 cheikh anime.glb' ci_export/
          cp 'player_3_Nelvyn_Godot_anime (1).glb' ci_export/

          mkdir -p /tmp/gltf-convert
          cd /tmp/gltf-convert
          npm init -y >/dev/null 2>&1
          npm install --silent @gltf-transform/core@4 @gltf-transform/extensions@4 draco3dgltf
          cat > decode_draco.mjs <<'NODE'
          import { NodeIO } from '@gltf-transform/core';
          import { ALL_EXTENSIONS } from '@gltf-transform/extensions';
          import draco3d from 'draco3dgltf';
          import process from 'node:process';

          const input = process.argv[2];
          const output = process.argv[3];
          const decoder = await draco3d.createDecoderModule();
          const io = new NodeIO()
            .registerExtensions(ALL_EXTENSIONS)
            .registerDependencies({'draco3d.decoder': decoder});
          const document = await io.read(input);
          for (const extension of document.getRoot().listExtensionsUsed()) {
            if (extension.extensionName === 'KHR_draco_mesh_compression') {
              extension.dispose();
            }
          }
          await io.write(output, document);
          NODE
          node decode_draco.mjs \
            "$GITHUB_WORKSPACE/Yvane_anime_Godot_Draco.glb" \
            "$GITHUB_WORKSPACE/ci_export/Yvane_anime_Godot_Draco.glb" \
            || echo 'Conversion Yvane impossible : utilisation du visuel de secours.'
          cd "$GITHUB_WORKSPACE"

          echo 'Contenu du projet exportable :'
          find ci_export -maxdepth 3 -type f | sort

      - name: Exporter le jeu avec Godot 4.4
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          relative_project_path: ./ci_export/
          cache: true
          export_debug: true
          archive_output: false
          presets_to_export: Android
          verbose: true

      - name: Signer et vérifier le véritable APK
        shell: bash
        run: |
          echo "Dossier d'export: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' -print
          UNSIGNED_APK="$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          test -s "$UNSIGNED_APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          mkdir -p artifact
          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" artifact/CHK_Pirate_Warrior_2_V0.1_aligned.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out artifact/CHK_Pirate_Warrior_2_V0.1.apk \
            artifact/CHK_Pirate_Warrior_2_V0.1_aligned.apk
          rm artifact/CHK_Pirate_Warrior_2_V0.1_aligned.apk

          "$APKSIGNER" verify --verbose --print-certs artifact/CHK_Pirate_Warrior_2_V0.1.apk
          unzip -t artifact/CHK_Pirate_Warrior_2_V0.1.apk >/dev/null
          test -s artifact/CHK_Pirate_Warrior_2_V0.1.apk
          ls -lh artifact/CHK_Pirate_Warrior_2_V0.1.apk
          file artifact/CHK_Pirate_Warrior_2_V0.1.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-2-V0.1-APK
          path: artifact/CHK_Pirate_Warrior_2_V0.1.apk
          if-no-files-found: error
          retention-days: 30
