name: Compiler CHK Pirate Warrior 2 v1 30/100

on:
  workflow_dispatch:
  push:
    branches:
      - agent/full-game-v2-complete
      - agent/full-game-v2-final-gameplay
      - agent/v4-grounded-gameplay
      - agent/v5-living-islands-vehicles
  pull_request:
    branches:
      - main
      - agent/full-game-v2-final-gameplay
      - agent/v4-grounded-gameplay

permissions:
  contents: write

concurrency:
  group: chk-pirate-warrior-2-v1-30-100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-v1-30-100:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Récupérer le dépôt complet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Installer Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34'

      - name: Installer Godot 4.4 et modèles Android
        shell: bash
        run: |
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/4.4.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_v4.4-stable_linux.x86_64
          sudo ln -sf /tmp/godot/bin/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz -O /tmp/godot/templates.tpz
          unzip -q -j /tmp/godot/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.4.stable"
          godot --version

      - name: Créer la clé Android debug
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=CHK Pirate Warrior 2,C=FR'
          fi

      - name: Configurer Godot Android
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF

      - name: Construire le projet avec tous les assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci_export artifact
          mkdir -p ci_export artifact
          cp project.godot export_presets.cfg ci_export/
          cp -R scenes scripts data assets ci_export/
          cp 'joueur 1 cheikh anime.glb' ci_export/
          cp 'Yvane_anime_Godot_Draco.glb' ci_export/
          cp 'player_3_Nelvyn_Godot_anime (1).glb' ci_export/
          test "$(find ci_export/assets/royaumes -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 11
          test -s 'ci_export/assets/interface/logo_chk_pirate_warrior_2.png'
          test -s 'ci_export/assets/interface/menu_principal_chk_pirate_warrior_2.png'
          test -s 'ci_export/assets/interface/menu_choix difficulté_aventure_chk_pirate_warrior_2.png'
          ASSET_MB=$(du -sm ci_export/assets | cut -f1)
          echo "Assets complets: ${ASSET_MB} Mo"
          echo "GLB avant réparation: $(find ci_export -type f -iname '*.glb' | wc -l)"
          if [ "$ASSET_MB" -lt 100 ]; then
            echo "ERREUR: export assets incomplet"
            exit 2
          fi

      - name: Normaliser tous les GLB lisibles puis isoler les corrompus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gltf-convert
          : > "$GITHUB_WORKSPACE/artifact/GLB_BROKEN.txt"
          cd /tmp/gltf-convert
          npm init -y >/dev/null 2>&1
          npm install --silent @gltf-transform/core@4 @gltf-transform/extensions@4 @gltf-transform/functions@4 draco3dgltf
          cp "$GITHUB_WORKSPACE/tools/repair_all_glb.mjs" /tmp/gltf-convert/repair_all_glb.mjs
          node /tmp/gltf-convert/repair_all_glb.mjs \
            "$GITHUB_WORKSPACE/ci_export" \
            "$GITHUB_WORKSPACE/artifact/GLB_BROKEN.txt"
          cat "$GITHUB_WORKSPACE/artifact/GLB_BROKEN.txt"

      - name: Importer toutes les ressources Godot
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:" godot-import.log; then
            echo 'Erreur de script détectée pendant import.'
            exit 3
          fi

      - name: Audit historique des 11 royaumes et assets
        shell: bash
        run: |
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --script res://scripts/tests/full_repo_audit.gd

      - name: Audit gameplay îles véhicules notices
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --script res://scripts/tests/v2_complete_audit.gd 2>&1 | tee v5-foundation-audit.log
          grep -q 'CHK_PIRATE_WARRIOR_2_V5_LIVING_ISLANDS_AUDIT_OK' v5-foundation-audit.log

      - name: Jouer automatiquement les 11 royaumes véhicules mort et navigation
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            res://scenes/tests/runtime_grounded_gameplay_test.tscn 2>&1 | tee godot-runtime-gameplay.log || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|ÉCHEC RUNTIME" godot-runtime-gameplay.log; then
            exit 4
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q 'CHK_PIRATE_WARRIOR_2_V5_RUNTIME_VEHICLES_VILLAGES_VARIETY_OK' godot-runtime-gameplay.log
          grep -q 'CHK_PIRATE_WARRIOR_2_V5_RUNTIME_FATAL_RESPAWN_OK' godot-runtime-gameplay.log

      - name: Exporter APK Android v1 30/100 validée
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_export/build/android"
          godot --headless --path "$GITHUB_WORKSPACE/ci_export" \
            --export-debug Android \
            "$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_v1_30_100_unsigned.apk" \
            --verbose 2>&1 | tee godot-export.log
          test -s "$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_v1_30_100_unsigned.apk"

      - name: Aligner signer et vérifier l'APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$GITHUB_WORKSPACE/ci_export/build/android/CHK_Pirate_Warrior_2_v1_30_100_unsigned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_v1_30_100.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$GITHUB_WORKSPACE/artifact/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$FINAL_APK" "$GITHUB_WORKSPACE/artifact/aligned.apk"
          rm "$GITHUB_WORKSPACE/artifact/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"
          unzip -t "$FINAL_APK" >/dev/null
          APK_MB=$(du -m "$FINAL_APK" | cut -f1)
          echo "APK finale v1 30/100: ${APK_MB} Mo"
          if [ "$APK_MB" -lt 70 ]; then
            echo 'ERREUR: APK anormalement petit.'
            exit 5
          fi
          sha256sum "$FINAL_APK" | tee artifact/SHA256.txt

      - name: Publier APK v1 30/100 et preuves d'exécution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-2-v1-30-100-APK
          path: |
            artifact/CHK_Pirate_Warrior_2_v1_30_100.apk
            artifact/SHA256.txt
            artifact/GLB_BROKEN.txt
            godot-import.log
            godot-runtime-gameplay.log
            godot-export.log
            v5-foundation-audit.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publier l'APK v1 30/100 dans GitHub Releases
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/agent/v5-living-islands-vehicles'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1-30-100'
          APK="$GITHUB_WORKSPACE/artifact/CHK_Pirate_Warrior_2_v1_30_100.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#CHK_Pirate_Warrior_2_v1_30_100.apk" --clobber
          else
            gh release create "$TAG" "$APK#CHK_Pirate_Warrior_2_v1_30_100.apk" \
              --target "$GITHUB_SHA" \
              --title 'CHK Pirate Warrior 2 — v1 30/100' \
              --notes 'Mise à jour Android v1 30/100 : correctifs de stabilité, trophée final renforcé, bateau/double bateau, marche arrière, HUD PV/pouvoir, pouvoirs visuels, identité Marvel/Pokémon, équipages libres et faune. APK compilée, alignée, signée et vérifiée automatiquement par GitHub Actions.'
          fi
