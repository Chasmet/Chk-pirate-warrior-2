name: Inspecter les rigs des héros

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_hero_rigs.py'
      - '.github/workflows/inspect_hero_rigs.yml'
      - 'joueur 1 cheikh anime.glb'
      - 'Yvane_anime_Godot_Draco.glb'
      - 'player_3_Nelvyn_Godot_anime (1).glb'

permissions:
  contents: write

jobs:
  inspect-rigs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Inspecter les trois personnages
        run: |
          blender --background --python tools/inspect_hero_rigs.py -- "$GITHUB_WORKSPACE"
      - name: Enregistrer le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HERO_RIG_REPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyser les rigs des trois héros [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
