name: Valider le projet Godot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/validate_godot_project.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Godot 4.4 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Importer et vérifier le projet
        run: |
          godot --headless --path . --editor --quit

      - name: Vérifier les fichiers clés
        run: |
          test -f project.godot
          test -f scenes/main/main.tscn
          test -f scenes/ui/hud_mobile.tscn
          test -f scripts/player/hero_controller.gd
          test -f scripts/npc/greeting_agent.gd
          test -f data/heroes.json
