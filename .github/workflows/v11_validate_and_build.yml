name: V11 - HUD niveau 50, 3 attaques et éditeur tactile

on:
  push:
    branches:
      - agent/v11-hud-attacks-layout-editor
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/v11_validate_and_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer V11
        uses: actions/checkout@v4

      - name: Vérifier données héros et niveau 50
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/heroes.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          heroes = json.loads(Path('data/heroes.json').read_text(encoding='utf-8'))
          assert set(heroes) >= {'cheikh', 'yvane', 'nelvyn'}
          for hero_id in ('cheikh', 'yvane', 'nelvyn'):
              hero = heroes[hero_id]
              assert hero.get('base_attack')
              assert len(hero.get('abilities', [])) == 2, (hero_id, len(hero.get('abilities', [])))
          game_state = Path('scripts/systems/game_state_v10.gd').read_text(encoding='utf-8')
          assert 'MAX_PLAYER_LEVEL := 50' in game_state
          print('Données V11 valides : 3 attaques par héros et niveau max 50')
          PY

      - name: Installer Godot 4.4 stable
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Construire mini-projet V11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci_validate
          mkdir -p ci_validate
          cp project.godot ci_validate/
          cp -R scenes scripts data ci_validate/
          if [ -f default_bus_layout.tres ]; then cp default_bus_layout.tres ci_validate/; fi
          while IFS= read -r -d '' file; do
            mkdir -p "ci_validate/$(dirname "$file")"
            cp "$file" "ci_validate/$file"
          done < <(find assets -type f -name '*.gd' -print0)
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci_validate/project.godot')
          text = p.read_text(encoding='utf-8')
          marker = '\n[editor_plugins]\n'
          start = text.find(marker)
          if start >= 0:
              end = text.find('\n[', start + len(marker))
              text = text[:start].rstrip() + '\n' if end < 0 else text[:start] + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Parser scripts et scènes V11
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path ci_validate --editor --quit-after 7 2>&1 | tee v11-godot-validate.log || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|Parser Error" v11-godot-validate.log; then
            echo 'Erreur Godot détectée dans V11.'
            exit 3
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Exécuter audit HUD attaques et éditeur tactile
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path ci_validate --script res://scripts/tests/v11_hud_attacks_layout_audit.gd 2>&1 | tee v11-hud-audit.log
          grep -q 'CHK_PIRATE_WARRIOR_2_V11_HUD_ATTACKS_LAYOUT_OK' v11-hud-audit.log

      - name: Régression quêtes inventaire V10
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path ci_validate --script res://scripts/tests/v10_quests_inventory_audit.gd 2>&1 | tee v11-v10-regression.log
          grep -q 'CHK_PIRATE_WARRIOR_2_V10_QUESTS_INVENTORY_OK' v11-v10-regression.log

      - name: Vérifier câblage V11
        shell: bash
        run: |
          grep -q 'mobile_input_overlay_v10.gd' scenes/ui/mobile_input_overlay.tscn
          grep -q 'hud_mobile_v10.gd' scenes/ui/hud_mobile.tscn
          grep -q 'V11_MIN_LAYOUT_SCALE := 0.40' scripts/ui/mobile_input_overlay_v10.gd
          grep -q 'V11_MAX_LAYOUT_SCALE := 1.80' scripts/ui/mobile_input_overlay_v10.gd
          grep -q 'ATQ %d' scripts/ui/mobile_input_overlay_v10.gd
          grep -q 'NIVEAU %d / %d' scripts/ui/hud_mobile_v10.gd
          grep -q 'XpProgressBar' scripts/ui/hud_mobile_v10.gd
          grep -q '_resolve_requested_ability_index' scripts/player/hero_controller_v10.gd

      - name: Publier journaux V11
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V11-HUD-Attaques-Editeur-Validation
          path: |
            v11-godot-validate.log
            v11-hud-audit.log
            v11-v10-regression.log
          if-no-files-found: warn
          retention-days: 14

  dispatch-full-apk:
    needs: validate-v11
    runs-on: ubuntu-latest
    steps:
      - name: Lancer le workflow APK complet sur V11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_android_apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
          echo "Compilation APK complète demandée pour $GITHUB_REF_NAME"
