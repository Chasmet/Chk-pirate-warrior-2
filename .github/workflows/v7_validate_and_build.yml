name: V7 - Valider coop Wi-Fi puis compiler APK

on:
  push:
    branches:
      - agent/v7-local-wifi-coop
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/v7_validate_and_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer V7
        uses: actions/checkout@v4

      - name: Installer Godot 4.4 stable
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Alléger les imports pour la validation syntaxique
        shell: bash
        run: |
          mkdir -p /tmp/chk_heavy_assets
          find . -maxdepth 1 -type f -name '*.glb' -exec mv {} /tmp/chk_heavy_assets/ \;
          for d in assets/royaumes assets/vrac assets/bateaux_glb assets/decors_glb assets/interface assets/audio assets/equipements assets/cc0_rides; do
            if [ -d "$d" ]; then touch "$d/.gdignore"; fi
          done

      - name: Parser scripts et scènes V7
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --editor --quit-after 7 2>&1 | tee v7-godot-validate.log || STATUS=$?
          STATUS=${STATUS:-0}
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call|Invalid access|Parser Error" v7-godot-validate.log; then
            echo 'Erreur Godot détectée dans la V7.'
            exit 3
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Vérifier les fonctions coop V7
        shell: bash
        run: |
          grep -q 'NetworkManager=' project.godot
          grep -q 'permissions/internet=true' export_presets.cfg
          grep -q 'permissions/change_wifi_multicast_state=true' export_presets.cfg
          grep -q 'ENetMultiplayerPeer' scripts/network/network_manager.gd
          grep -q 'MAX_PLAYERS := 3' scripts/network/network_manager.gd
          grep -q '255.255.255.255' scripts/network/network_manager.gd
          grep -q 'COOP LOCALE WI-FI' scripts/ui/main_menu_runtime.gd
          grep -q 'can_write_campaign_save' scripts/systems/game_state.gd
          grep -q 'request_combat' scripts/player/hero_controller_v3.gd

      - name: Publier le journal de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V7-Godot-WiFi-Coop-Validation
          path: v7-godot-validate.log
          if-no-files-found: warn
          retention-days: 14

  dispatch-full-apk:
    needs: validate-v7
    runs-on: ubuntu-latest
    steps:
      - name: Lancer le workflow APK complet sur V7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_android_apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
          echo "Compilation APK complète demandée pour $GITHUB_REF_NAME"
